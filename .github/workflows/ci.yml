name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned rather than floating on latest, which is what every sibling
          # repo already did and this one did not — so this is the repo that
          # proved the point. On 2026-09-12 `latest` moved 2.13.1 → 2.13.2, a
          # newer gofumpt flagged cmd/bergrb/main.go untouched since August,
          # and CI went red with nothing having been committed to it.
          #
          # It is also a hard floor, not a preference: golangci-lint refuses to
          # run when the Go it was built with is below the module's `go`
          # directive, and reports that refusal as "0 issues" — a false green,
          # which is the worse failure. Bump this with go.mod.
          version: v2.13.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -count=1 ./internal/...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run testcontainers integration tests
        run: go test -race -count=1 -timeout=20m ./test/...
