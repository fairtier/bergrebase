name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than floating on latest, which is what every sibling
          # repo already did and this one did not — so this is the repo that
          # proved the point. On 2026-09-12 `latest` moved 2.13.1 → 2.13.2, a
          # newer gofumpt flagged cmd/bergrb/main.go untouched since August,
          # and CI went red with nothing having been committed to it.
          #
          # It is also a hard floor, not a preference: golangci-lint refuses to
          # run when the Go it was built with is below the module's `go`
          # directive, and reports that refusal as "0 issues" — a false green,
          # which is the worse failure. Bump this with go.mod.
          version: v2.15.0
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -count=1 ./internal/... ./cmd/...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The DuckDB oracles and the real-writer tests need these. ubuntu-latest
      # ships no duckdb, and the oracles used to skip here without saying so.
      - name: Install test writers
        shell: bash
        run: test/tools/install-test-tools.sh "$RUNNER_TEMP/test-tools" | sed -E "s/^export ([^=]+)='(.*)'$/\1=\2/" >> "$GITHUB_ENV"

      # CI=true makes a missing tool a failure rather than a skip (see
      # test/harness/required.go). BERGREBASE_NIGHTLY runs the slower scenarios
      # too; there is no separate nightly workflow.
      - name: Run testcontainers integration tests
        shell: bash
        env:
          BERGREBASE_NIGHTLY: "1"
        run: go test -race -count=1 -timeout=40m -json ./test/... | tee "$RUNNER_TEMP/test-events.jsonl" | jq -r 'select(.Output) | .Output'

      # A skip reports the same green as a pass, so none is allowed, wherever it
      # came from (a new t.Skip, -short, a harness path). The second check catches
      # the other way to run nothing: the oracles disappearing altogether.
      - name: Refuse skipped tests
        shell: bash
        run: |
          events="$RUNNER_TEMP/test-events.jsonl"
          skipped=$(jq -r 'select(.Action == "skip" and .Test != null) | .Test' "$events")
          if [[ -n "$skipped" ]]; then
            echo "::error::tests skipped in CI:"
            echo "$skipped"
            exit 1
          fi
          oracles=$(jq -r 'select(.Action == "pass" and (.Test // "" | test("^TestDuckDBOracle_[^/]*$"))) | .Test' "$events" | wc -l)
          writers=$(jq -r 'select(.Action == "pass" and (.Test // "" | test("^TestRealWriters_[^/]*$"))) | .Test' "$events" | wc -l)
          echo "passed: $oracles DuckDB oracle tests, $writers real-writer tests"
          if (( oracles < 8 || writers < 9 )); then
            echo "::error::expected at least 8 oracle and 9 real-writer tests to pass"
            exit 1
          fi
