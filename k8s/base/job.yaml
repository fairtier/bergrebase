apiVersion: batch/v1
kind: Job
metadata:
  name: bergrebase-rewrite
  labels:
    app.kubernetes.io/name: bergrebase
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rewriter
          image: ghcr.io/fairtier/bergrebase:v1.0.0
          args:
            - --catalog-uri=$(CATALOG_URI)
            - --catalog-warehouse=$(CATALOG_WAREHOUSE)
            - --catalog-token-from-env=CATALOG_TOKEN
            - --source-prefix=$(SOURCE_PREFIX)
            - --target-prefix=$(TARGET_PREFIX)
            - --target-endpoint=$(TARGET_ENDPOINT)
            - --target-region=$(TARGET_REGION)
            - --target-path-style=$(TARGET_PATH_STYLE)
            - --namespace=$(ICEBERG_NAMESPACE)
            - --all-tables
          env:
            # Non-secret config — supplied by the bergrebase-config ConfigMap
            # generated by the overlay (see ./kustomization.yaml).
            - name: CATALOG_URI
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: catalog-uri } }
            - name: CATALOG_WAREHOUSE
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: catalog-warehouse } }
            - name: SOURCE_PREFIX
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: source-prefix } }
            - name: TARGET_PREFIX
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: target-prefix } }
            - name: TARGET_ENDPOINT
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: target-endpoint } }
            - name: TARGET_REGION
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: target-region } }
            - name: TARGET_PATH_STYLE
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: target-path-style } }
            - name: ICEBERG_NAMESPACE
              valueFrom: { configMapKeyRef: { name: bergrebase-config, key: iceberg-namespace } }
            # Credentials — supplied by the bergrebase-creds Secret. The
            # overlay must create it (out-of-band, sealed-secrets, ESO, or
            # secretGenerator with a gitignored .env file).
            - name: CATALOG_TOKEN
              valueFrom: { secretKeyRef: { name: bergrebase-creds, key: catalog-token } }
            - name: SOURCE_AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: bergrebase-creds, key: source-access-key-id } }
            - name: SOURCE_AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: bergrebase-creds, key: source-secret-access-key } }
            - name: TARGET_AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: bergrebase-creds, key: target-access-key-id } }
            - name: TARGET_AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: bergrebase-creds, key: target-secret-access-key } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi   }
